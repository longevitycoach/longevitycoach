name: Branch Protection

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: branch-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-branch-protection:
    name: Enforce Branch Protection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # This is not an npm workspace: the root package.json only delegates into
      # frontend/ (`lint` runs `cd frontend && npm run lint`). Installing at the
      # root alone leaves frontend/node_modules empty, which is why every run
      # since April failed with "next: not found".
      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Check for WIP in PR title
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request?.title || '';
            if (title.match(/\bWIP\b|\bDNM\b|\bdo not merge\b/i)) {
              core.setFailed('PR title contains WIP/DNM marker. Please remove it before merging.');
            }

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
          requireScope: false

      - name: Comment on PR with next steps
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            if (pr.draft) {
              console.log('PR is a draft, no action needed');
              return;
            }

            const hasReviewers =
              pr.requested_reviewers?.length > 0 || pr.requested_teams?.length > 0;

            if (!hasReviewers) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '👋 Please assign reviewers to this PR.'
              });
            }

      - name: Check for documentation updates
        if: contains(github.event.pull_request.labels.*.name, 'documentation')
        run: |
          if ! git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | grep -q "\.md$"; then
            echo "No documentation (.md) files were updated. Please ensure documentation is kept up to date."
            exit 1
          fi

      - name: Check for test updates
        if: contains(github.event.pull_request.labels.*.name, 'test')
        run: |
          if ! git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | grep -q "\.test\.[jt]sx\?$"; then
            echo "No test files were updated. Please ensure tests are added or updated with new features."
            exit 1
          fi
